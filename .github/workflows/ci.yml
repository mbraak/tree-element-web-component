name: Continuous integration

on:
  push:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm run ci
